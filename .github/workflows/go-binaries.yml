name: go-binaries

# 可运行二进制构建/发布：
#   - 先构建面板前端（web/ → internal/panel/dist，含类型检查 / ESLint / 单元测试），产物供后续任务 go:embed
#   - PR        → 测试 + 五平台编译验证（产物仅存 artifact，不发布）
#   - push main → 同上 + 覆盖固定的「最新构建」Release（tag latest 跟随 main 移动）；
#                 这次推送升了版本号（appVersion 对应的 vX.Y.Z 标签还不存在）时，再打标签、建正式 Release
# 版本号规则见 docs/releasing.md：有使用者看得到的改动就在推送前升版本号、写好 docs/CHANGELOG.md，
# 不手动打 tag。发布纪律：-s -w 剥离、二进制必须带上这一版的更新日志与面板前端。
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "go.mod"
      - "go.sum"
      - "*.go"
      - "cmd/**"
      - "internal/**"
      - "docs/CHANGELOG.md"
      - "config.example.json"
      - "web/**"
      - ".github/workflows/go-binaries.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # 面板前端：构建一次，产物上传给 test / build 共用（dist 不进版本库）
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build   # 类型检查 + ESLint（零警告）+ 单元测试 + 构建到 ../internal/panel/dist
      - uses: actions/upload-artifact@v4
        with:
          name: panel-dist
          path: internal/panel/dist
          retention-days: 7

  test:
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: panel-dist
          path: internal/panel/dist
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # 前端产物已就位：面板包的 TestBuiltDistIsServable 会真实校验页面引用的每个资源
      - run: go test ./...

  build:
    needs: [web, test]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: windows, goarch: amd64, ext: .zip }
          - { goos: linux, goarch: amd64, ext: .tar.gz }
          - { goos: linux, goarch: arm64, ext: .tar.gz }
          - { goos: darwin, goarch: amd64, ext: .tar.gz }
          - { goos: darwin, goarch: arm64, ext: .tar.gz }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: panel-dist
          path: internal/panel/dist
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: 取源码版本号
        id: ver
        run: echo "v=$(grep -oP 'appVersion = "\K[^"]+' cmd/server/main.go)" >> "$GITHUB_OUTPUT"

      - name: 构建（剥离符号，对齐本地发布口径）
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: go build -ldflags "-s -w" -o "wb2api${{ matrix.goos == 'windows' && '.exe' || '' }}" ./cmd/server

      # 版本断言：二进制内嵌的更新日志必须有这一版（防交叉编译矩阵里编错树）。版本号本身太短，
      # 直接 grep 容易误中；更新日志最新一版 == appVersion 由 go test 保证。
      - name: 断言二进制版本
        run: |
          BIN="wb2api${{ matrix.goos == 'windows' && '.exe' || '' }}"
          if ! grep -qaF "## [${{ steps.ver.outputs.v }}]" "$BIN"; then
            echo "::error::binary does not embed the changelog entry for ${{ steps.ver.outputs.v }}"
            exit 1
          fi
          echo "version assert OK: ${{ steps.ver.outputs.v }}"

      # 面板断言：发布的二进制必须带面板前端（dist 为空时 go build 也能通过，只会显示「前端还没有构建」）
      - name: 断言二进制包含面板前端
        run: |
          BIN="wb2api${{ matrix.goos == 'windows' && '.exe' || '' }}"
          if ! grep -qa 'src="/panel/assets/' "$BIN"; then
            echo "::error::binary does not embed the panel frontend (internal/panel/dist was empty)"
            exit 1
          fi
          echo "panel assert OK"

      - name: 打包（windows=zip 三件套，其余=tar.gz）
        run: |
          V="${{ steps.ver.outputs.v }}"
          case "${{ matrix.goos }}" in
            windows)
              NAME="wb2api-panel-v${V}-windows-amd64.zip"
              zip -q "$NAME" wb2api.exe config.example.json README.md
              ;;
            *)
              NAME="wb2api-panel-v${V}-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz"
              tar czf "$NAME" wb2api config.example.json README.md
              ;;
          esac
          echo "name=$NAME" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.name }}
          path: ${{ env.name }}
          retention-days: 7

  # 仅 push main：把五平台包覆盖到固定的「最新构建」Release，与 Docker 的 latest 镜像同步。
  # 文件名去掉版本号（wb2api-panel-linux-amd64.tar.gz），releases/download/latest/<文件名> 链接长期不变。
  # 「Latest」标记留给正式版本的 Release，这里不抢。
  rolling:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # 连续推送时排队执行，不并发改同一个 Release
    concurrency:
      group: rolling-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: 跳过已过时的构建
        id: fresh
        run: |
          HEAD=$(git ls-remote origin refs/heads/main | cut -f1)
          if [[ "$HEAD" != "$GITHUB_SHA" ]]; then
            echo "main 已前进到 $HEAD，本次（$GITHUB_SHA）不再覆盖，留给更新的运行"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v4
        if: steps.fresh.outputs.ok == 'true'
        with:
          pattern: wb2api-panel-*
          path: dist
          merge-multiple: true
      - name: 去掉文件名里的版本号 + checksums
        if: steps.fresh.outputs.ok == 'true'
        run: |
          cd dist
          for f in wb2api-panel-v*; do mv "$f" "wb2api-panel-${f#wb2api-panel-v*-}"; done
          sha256sum *.zip *.tar.gz > checksums.txt
          ls -la
      - name: 移动 latest 标签并覆盖 Release
        if: steps.fresh.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(grep -oP 'appVersion = "\K[^"]+' cmd/server/main.go)
          SHORT=${GITHUB_SHA::7}
          BUILT=$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M')
          TITLE="最新构建 v${V}（${SHORT}）"
          NOTES=$(printf '%s\n' \
            "随 main 分支自动更新的构建，与 Docker 镜像 \`latest\` 同步，下一次推送会覆盖这里的文件。正式版本见带版本号的 Release。" \
            "" \
            "- 版本：\`${V}\`" \
            "- 提交：https://github.com/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}" \
            "- 构建时间：${BUILT}（UTC+8）" \
            "- 校验：\`sha256sum -c --ignore-missing checksums.txt\`")
          git tag -f latest "$GITHUB_SHA"
          git push -f origin refs/tags/latest
          if gh release view latest >/dev/null 2>&1; then
            gh release edit latest --title "$TITLE" --notes "$NOTES" --prerelease=false --latest=false
            gh release upload latest dist/* --clobber
          else
            gh release create latest dist/* --title "$TITLE" --notes "$NOTES" --latest=false --verify-tag
          fi

  # 仅 push main：appVersion 对应的 vX.Y.Z 标签还不存在（这次推送升了版本号）时，打标签并建正式 Release，
  # 说明取 docs/CHANGELOG.md 里这一版的条目，附五平台包（文件名带版本号）和 checksums。标签已在更早的提交上
  # （版本号没变）就跳过。不受 rolling 的「过时跳过」影响：每个版本都要有自己的 Release。
  # 上一次发版中途失败、标签没打上时，下一次推送会补发（标签落在那次推送的提交上）。
  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: version-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 取已有的版本标签，算对比链接
      - name: 判断是否新版本
        id: ver
        run: |
          V=$(grep -oP 'appVersion = "\K[^"]+' cmd/server/main.go)
          echo "v=$V" >> "$GITHUB_OUTPUT"
          TAGGED=$(git ls-remote origin "refs/tags/v$V" "refs/tags/v$V^{}" | tail -1 | cut -f1)
          if [[ -n "$TAGGED" && "$TAGGED" != "$GITHUB_SHA" ]]; then
            echo "v$V 已在 $TAGGED 发布，这次推送没有升版本号，跳过"
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v4
        if: steps.ver.outputs.new == 'true'
        with:
          pattern: wb2api-panel-*
          path: dist
          merge-multiple: true
      - name: 本版说明 + checksums
        if: steps.ver.outputs.new == 'true'
        run: |
          V="${{ steps.ver.outputs.v }}"
          # 取「## [V]」到下一个「## 」之间的内容；指向 docs/ 里其他文档的相对链接补成这一版标签下的地址
          awk -v h="## [$V]" 'index($0, h) == 1 { on = 1; next } on && /^## / { exit } on' docs/CHANGELOG.md \
            | sed -E "s#\]\(([^):]+\.md[^)]*)\)#](https://github.com/${GITHUB_REPOSITORY}/blob/v${V}/docs/\1)#g" > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::docs/CHANGELOG.md 里没有 $V 这一版的条目"
            exit 1
          fi
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          if [[ "$V" == *-* ]]; then
            DOCKER="\`${IMAGE}:${V}\`"
          else
            DOCKER="\`${IMAGE}:${V}\`（同一镜像还有 \`${V%.*}\`、\`${V%%.*}\` 标签）"
          fi
          PREV=$(git tag -l 'v[0-9]*' --sort=-v:refname | grep -vx "v$V" | head -1 || true)
          {
            echo
            echo "---"
            echo
            echo "- Docker 镜像：${DOCKER}"
            echo "- 升级方法：见[部署与运维](https://github.com/${GITHUB_REPOSITORY}/blob/v${V}/docs/deployment.md#升级备份与停机)"
            echo "- 校验：\`sha256sum -c --ignore-missing checksums.txt\`"
            if [[ -n "$PREV" ]]; then
              echo "- 完整变更：https://github.com/${GITHUB_REPOSITORY}/compare/${PREV}...v${V}"
            fi
          } >> notes.md
          cat notes.md
          cd dist && sha256sum *.zip *.tar.gz > checksums.txt && ls -la
      - name: 打标签并建 Release
        if: steps.ver.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ steps.ver.outputs.v }}"
          if gh release view "v$V" >/dev/null 2>&1; then
            gh release upload "v$V" dist/* --clobber
          elif [[ "$V" == *-* ]]; then
            gh release create "v$V" dist/* --target "$GITHUB_SHA" --title "v$V" --notes-file notes.md --prerelease --latest=false
          else
            gh release create "v$V" dist/* --target "$GITHUB_SHA" --title "v$V" --notes-file notes.md --latest
          fi
